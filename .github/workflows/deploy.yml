# Push to main: check, build and deploy the game and its room server to Cloudflare (wrangler.jsonc).
# The hostname play.joellithgow.com is attached in joellithgow95/jlithgow-ops (terraform/workers.tf).
#
# Secrets live in the `production` environment, not the repo: CLOUDFLARE_API_TOKEN (Workers Scripts: Edit,
# account only) and CLOUDFLARE_ACCOUNT_ID. That environment only allows `main`, so a workflow someone adds
# on their own branch can't read them. Keep it that way.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run check
      - name: Deploy to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
