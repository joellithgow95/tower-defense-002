name: Idea or feature request
description: Something you want in the game
labels: [enhancement]
body:
  - type: textarea
    attributes: { label: What do you want? }
    validations: { required: true }
  - type: textarea
    attributes: { label: Why would it be fun?, description: What moment in a match would it improve? }
    validations: { required: true }
  - type: input
    attributes: { label: Games that do something like this }
