<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tower Defense 002</title>
  <link rel="stylesheet" href="/src/game/style.css" />
</head>
<body>
  <canvas id="board"></canvas>
  <header>
    <div id="players"></div>
    <div id="message" role="status"></div>
  </header>
  <section id="lobby" hidden>
    <h2>Room <code id="room-code"></code></h2>
    <p><button id="copy-link">Copy invite link</button> Anyone with the link can join or watch.</p>
    <label>Your name <input id="name" autocomplete="nickname" /></label>
    <label>Mode <select id="room-mode"></select></label>
    <ol id="seats"></ol>
    <p id="watching"></p>
    <p><button id="start">Start match</button> <span id="lobby-note"></span></p>
  </section>
  <footer>
    <nav id="cards"></nav>
    <nav><select id="mode" aria-label="Game mode"></select><button id="launch">Launch <kbd>Space</kbd></button><button id="sell">Sell <kbd>X</kbd></button><button id="pause">Pause <kbd>P</kbd></button><button id="restart">Restart <kbd>R</kbd></button><button id="report">Copy bug report</button><button id="online">Play online</button></nav>
  </footer>
  <script type="module" src="/src/game/main.ts"></script>
</body>
</html>
